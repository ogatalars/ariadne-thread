name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --python ${{ matrix.python }} --group dev pytest -q
      # Demo for free: dry-run never calls a model, so no API key is needed.
      - run: uv run --python ${{ matrix.python }} ariadne . "how does the token budget work?" --dry-run --budget 6k > /dev/null
