[project]
name = "ariadne-thread"
version = "0.1.0"
description = "Understand how a piece of software works with an LLM, on a token budget."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["anthropic>=1.0"]

[project.scripts]
ariadne = "ariadne.cli:main"
ariadne-thread = "ariadne.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ariadne"]
